plugins {
    id 'com.android.application'
}

android {
    namespace 'com.the412banner.retroideasyroot'
    compileSdk 35

    defaultConfig {
        applicationId 'com.the412banner.retroideasyroot'
        minSdk 30
        targetSdk 35
        // keep versionName == EASYROOT_VERSION in ../../scripts/tools/lib.sh (CI checks it)
        versionCode 1
        versionName '0.1.0'
    }

    // Public AOSP testkey (android@android.com, SHA-256 A4:0D:A8:0A:59:D1:70:CA…), the same one Bannerlator uses,
    // so every build has the same signature and installs over the last one. v1 + v2 + v3.
    signingConfigs {
        testkey {
            storeFile file('../keystore/testkey.p12')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'testkey'
            keyPassword 'android'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.testkey
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.testkey
        }
    }

    // The scripts ship inside the app from the same folder the script pack is made from.
    sourceSets {
        main {
            assets.srcDirs = ['../../scripts']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
